<title>台ヨミ</title>
<style>
:where(button[data-nav]){background:none;border:0;padding:0;margin:0;font:inherit;color:inherit;text-align:inherit;cursor:pointer}
:root{

radial-gradient(120% 80% at 80% -10%,#1a1f45 0%,transparent 60%),

}
:root[data-hn-theme="light"]{
color-scheme:light;
--bg:#eef1f6;--card:#fbfcfe;--card2:#e3e7ef;--line:#cdd3de;--text:#121722;--sub:#454d5e;--dim:#6c7486;
--red:#cf222b;--red2:#fde3e4;--on-red:#fff;--chip-on:#b0151d;--gold:#946600;--gold2:#bd8a12;--on-gold:#fff;
--green:#0d7636;--minus:#c22828;--blue:#2563c9;
--header-bg:rgba(238,241,246,.92);--tab-bg:rgba(251,252,254,.97);--tab-fg:#2f3645;--tab-on:#cf222b;
--notice-bd:#c98b33;--notice-bg:#fff6e8;--notice-fg:#664111;--notice-b:#432904;--prov:#a25607;--undet-bg:#e9edf3;
--toast-bg:#262b36;--toast-fg:#fff;--low:#c22828;--low-bd:#edb2b2;--mid-bd:#dcc68a;--hi-bd:#9bd3ae;

*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Hiragino Sans","Noto Sans JP","Yu Gothic UI",sans-serif;font-size:15px;line-height:1.5;-webkit-text-size-adjust:100%}
body{padding-bottom:calc(68px + env(safe-area-inset-bottom));overflow-x:hidden;background:var(--sky);background-attachment:fixed;line-break:strict}
.nw{white-space:nowrap}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:8px;padding:calc(10px + env(safe-area-inset-top,0px)) var(--pad) 10px;background:var(--header-bg);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top .ttl{flex:1;min-width:0;display:flex;flex-direction:column}
.top #title{font-weight:800;font-size:18px;overflow-wrap:anywhere}
.top small{color:var(--sub);font-size:12px;overflow-wrap:anywhere}
.back{background:none;border:0;font-size:30px;line-height:1;padding:0 6px 4px 0;cursor:pointer}
.theme{flex:none;width:34px;height:34px;display:grid;place-items:center;background:var(--card);border:1px solid var(--line);border-radius:50%;color:var(--text);cursor:pointer;padding:0}
.theme svg{width:18px;height:18px}
main{max-width:640px;margin:0 auto;padding:12px var(--pad) 24px}
.loading,.empty{color:var(--sub);text-align:center;padding:40px 0}

.row{display:flex;align-items:center;gap:8px;min-width:0}
.grow{flex:1;min-width:0}
.wrap{overflow-wrap:anywhere;word-break:break-word}
.muted{color:var(--sub)}.dim{color:var(--dim)}.small{font-size:12px}

.badge{display:inline-block;font-size:11px;padding:1px 7px;border-radius:999px;border:1px solid var(--line);color:var(--sub);white-space:nowrap}

.badge.ok{border-color:var(--green);color:var(--green)}
.badge.ng{border-color:var(--minus);color:var(--minus)}
.badge.wait{border-color:var(--gold);color:var(--gold)}
.badge.na{border-color:var(--dim);color:var(--sub)}
.notice{border:1px dashed var(--notice-bd);background:var(--notice-bg);color:var(--notice-fg);border-radius:var(--r);padding:10px 12px;font-size:12.5px;margin:8px 0}
.notice b{color:var(--notice-b)}

.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:none}

select,input[type=search],input[type=date]{width:100%;background:var(--card);border:1px solid var(--line);color:var(--text);border-radius:10px;padding:9px 10px;font:inherit;min-width:0}
label.f{display:flex;gap:8px;align-items:center;margin:6px 0}

.search{margin:4px 0 8px}
.store{display:flex;gap:10px;align-items:flex-start}
.store .nm{font-weight:700;overflow-wrap:anywhere}
.star{background:none;border:0;font-size:20px;color:var(--dim);cursor:pointer;padding:0 2px;line-height:1}
.star.on{color:var(--gold)}
.addr{display:flex;align-items:flex-start;gap:6px;color:var(--sub);font-size:13px}
.addr span{overflow-wrap:anywhere}
.copy{flex:none;background:none;border:1px solid var(--line);border-radius:6px;width:26px;height:24px;color:var(--sub);cursor:pointer;font-size:13px;line-height:1}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:10px}
.stat .k{font-size:12px;color:var(--sub)}
.stat .v{font-size:24px;font-weight:800;line-height:1.2}
.stat .s{font-size:11px;color:var(--dim)}
.btn{display:block;width:100%;text-align:center;background:var(--red);color:var(--on-red);border:0;border-radius:var(--r);padding:12px;font-weight:800;margin:12px 0;cursor:pointer}
.btn.ghost{background:var(--red2);border:1.5px solid var(--red);color:var(--text);font-weight:700;box-shadow:0 2px 8px rgba(0,0,0,.25)}
.btn.ghost:active{filter:brightness(1.15)}
.links{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:10px 0}
.links button{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 4px;text-align:center;font-size:12.5px}
.cand{cursor:pointer}
.cand .rk{flex:none;width:34px;height:34px;border-radius:8px;background:var(--card2);display:grid;place-items:center;font-weight:800;font-size:18px}
.cand.r1 .rk{background:var(--gold);color:var(--on-gold)}
.cand .no{font-size:24px;font-weight:800}

.bar{height:6px;background:var(--card2);border-radius:3px;overflow:hidden;margin:6px 0}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--gold2))}
.ev{font-size:12.5px;color:var(--sub);margin:2px 0;overflow-wrap:anywhere}

.detail{border-top:1px solid var(--line);margin-top:8px;padding-top:8px;font-size:12.5px;color:var(--sub)}
.detail dl{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;margin:0}
.detail dt{color:var(--dim)}.detail dd{margin:0;overflow-wrap:anywhere}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:6px 4px;border-bottom:1px solid var(--line);text-align:right;vertical-align:top}
th{color:var(--sub);font-weight:500;font-size:12px}
th:first-child,td:first-child{text-align:left}
td.name{overflow-wrap:anywhere;word-break:break-word}
.tbl{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:4px 10px;overflow-x:auto}
tr.click{cursor:pointer}
.spark{display:flex;align-items:flex-end;gap:2px;height:70px;border-bottom:1px solid var(--line);position:relative}
.spark i{flex:1;min-width:2px;background:var(--green);border-radius:2px 2px 0 0}
.spark i.n{background:var(--minus);align-self:flex-start;border-radius:0 0 2px 2px}
.spark .zero{position:absolute;left:0;right:0;top:50%;border-top:1px dashed var(--line)}
.sparkwrap{display:flex;flex-direction:column}
.spark2{display:grid;grid-template-rows:35px 35px}
.units{display:flex;gap:4px;flex-wrap:wrap;margin:6px 0}
.units span{min-width:44px;text-align:center;padding:6px 4px;border-radius:6px;background:var(--red2);border:1px solid var(--red);font-weight:700}
.hist{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line);cursor:pointer}
.hist:last-child{border-bottom:0}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:6;display:flex;background:var(--tab-bg);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;padding:8px 0 7px;color:var(--tab-fg);font-size:20px;line-height:1.1}
.tabbar button span{font-size:11.5px;margin-top:3px;font-weight:600}
.tabbar button.on{color:var(--tab-on)}.tabbar button.on span{font-weight:800}
.tabbar button.off{opacity:.6}
.toast{position:fixed;left:50%;bottom:80px;transform:translateX(-50%);background:var(--toast-bg);color:var(--toast-fg);padding:8px 14px;border-radius:999px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:9}
.toast.show{opacity:1}
.sample-wrap{position:relative;border:1px dashed var(--gold);border-radius:var(--r);padding:8px;margin:8px 0}
.sample-wrap::before{content:"サンプル表示（実データ・実予想ではありません）";display:block;font-size:11px;color:var(--gold);margin-bottom:4px}
details summary{cursor:pointer;color:var(--sub);font-size:13px}
.gb{display:inline-block;min-width:26px;text-align:center;font-size:12px;font-weight:800;padding:1px 6px;border-radius:6px;border:1px solid var(--line);color:var(--sub)}
.gb.g-低{color:var(--low);border-color:var(--low-bd)}.gb.g-中{color:var(--gold);border-color:var(--mid-bd)}.gb.g-高{color:var(--green);border-color:var(--hi-bd)}
.gb.g-top{background:var(--gold);color:var(--on-gold);border-color:var(--gold)}
tr.top6{background:var(--top6-bg)}tr.top6 td:first-child{box-shadow:inset 3px 0 0 var(--gold)}
.lks{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.lk{display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 10px;min-width:0}
.lk b{font-size:13px}.lk b::after{content:" ↗";color:var(--dim);font-weight:400}
[data-nav]{cursor:pointer;-webkit-tap-highlight-color:var(--tap)}
.sk-bars{position:relative;display:flex;align-items:flex-end;gap:4px;height:90px;margin:6px 0 2px;border-bottom:1px solid var(--line)}
.sk-bar{flex:1;min-width:0;background:var(--card2);border-radius:3px 3px 0 0}
.sk-bar.on{background:var(--gold)}
.sk-base{position:absolute;left:0;right:0;border-top:1px dashed var(--sub);pointer-events:none}
.sk-labs{display:flex;gap:4px;margin-bottom:4px}
.sk-labs div{flex:1;min-width:0;text-align:center;display:flex;flex-direction:column;line-height:1.2}
.sk-labs b{font-size:11px;color:var(--sub);font-weight:600}.sk-labs span{font-size:9.5px;color:var(--dim);font-variant-numeric:tabular-nums}
svg.uc{width:100%;height:auto;display:block;touch-action:pan-y;font-variant-numeric:tabular-nums}
.uc-grid{stroke:var(--line);stroke-width:1}
.uc-zero{stroke:var(--sub);stroke-width:1;stroke-dasharray:4 3}
.uc-ax{fill:var(--dim);font-size:10px}
.uc-line{fill:none;stroke:var(--gold);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.uc-pt-p{fill:var(--green);stroke:var(--card);stroke-width:1.5}
.uc-pt-n{fill:var(--minus);stroke:var(--card);stroke-width:1.5}
.uc-cross{stroke:var(--sub);stroke-width:1}
.uc-tip{font-size:12.5px;min-height:20px;margin:4px 0;overflow-wrap:anywhere}
.lg{display:inline-block;width:14px;height:3px;border-radius:2px;vertical-align:middle;margin-right:4px}
th{white-space:nowrap}td .small,td .dim{white-space:nowrap}
details.month>summary{display:flex;align-items:center;gap:6px;color:var(--text);font-size:14px}
details.day{border-bottom:1px solid var(--line)}
details.day:last-child{border-bottom:0}
details.day>summary{padding:8px 0;color:var(--text);list-style:none}
details.day>summary::-webkit-details-marker{display:none}
details.day>summary::after{content:"›";color:var(--dim);transition:transform .15s}
details.day[open]>summary::after{transform:rotate(90deg)}
.day-body{padding:0 0 8px 8px;border-left:2px solid var(--line);margin-bottom:6px}
.mrow{padding:6px 0;border-bottom:1px solid var(--line)}
.mrow:last-child{border-bottom:0}
.nm1{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.units-mini{display:flex;flex-wrap:wrap;gap:2px 10px;font-variant-numeric:tabular-nums;font-weight:700;font-size:13px}
.units-mini small{font-weight:400;color:var(--dim);margin-left:1px;font-size:10px}
.ev-banner{display:flex;align-items:flex-start;gap:8px;margin:8px 0;padding:10px 12px;border-radius:var(--r);border:1px solid var(--gold);background:var(--top6-bg)}
.sortbar{display:flex;align-items:center;flex-wrap:wrap;gap:6px;margin:6px 0 4px;padding-bottom:2px}
.sortbar>span{flex:none}
.sortbar button{flex:none;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:12px;color:var(--sub);cursor:pointer;white-space:nowrap}
.sortbar button.on{border-color:var(--red);color:var(--chip-on);background:var(--red2)}
.sortbar button.dir{margin-left:auto;border-color:var(--gold);color:var(--gold)}
th[data-si]{cursor:pointer}
th.s-desc::after{content:" ↓";color:var(--gold)}
th.s-asc::after{content:" ↑";color:var(--gold)}
.kbtns{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:6px;margin-top:8px}
.kbtn{display:flex;align-items:center;gap:6px;background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:8px 10px;cursor:pointer;color:var(--text);font-weight:700;font-size:13px;text-align:left}
.kbtn svg{flex:none;width:18px;height:18px;color:var(--gold)}
.kbtn .chev{margin-left:auto;color:var(--dim);transition:transform .15s}
.kbtn.on{border-color:var(--red);background:var(--red2)}
.kbtn.on .chev{transform:rotate(90deg)}
.spark i.sel{outline:2px solid var(--gold);outline-offset:0}
.spark-tip{min-height:20px;font-size:12.5px;margin-top:6px}
.spark2{cursor:pointer}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px;margin-top:6px}
.cal .wd{font-size:11px;color:var(--dim);text-align:center}
.cal .wd.sun{color:var(--minus)}.cal .wd.sat{color:var(--blue)}
.cal button{position:relative;height:38px;min-width:0;width:100%;margin:0;border-radius:8px;border:1px solid var(--line);background:var(--undet-bg);color:var(--dim);font-size:13px;cursor:pointer;padding:0}
.cal button.has{background:var(--hi-bd);color:var(--text);border-color:var(--green)}

.cal button.sp{box-shadow:inset 0 0 0 2px var(--gold)}
.cal button.evd::after{content:"";position:absolute;right:4px;top:4px;width:6px;height:6px;border-radius:50%;background:var(--red)}
.cal button.sel{outline:2px solid var(--red);outline-offset:1px;font-weight:800}
.cal button.blank{visibility:hidden}
.cal-legend{display:flex;flex-wrap:wrap;gap:10px;font-size:11.5px;color:var(--sub);margin-top:6px}
.cal-legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:4px;vertical-align:-2px;border:1px solid var(--line)}
.cand[data-u]{cursor:pointer}
.cand .basis:not(:empty){margin-top:8px;padding-top:8px;border-top:1px dashed var(--line)}
details.dbtn{margin-top:8px}

details.dbtn>summary::-webkit-details-marker{display:none}

details.dbtn>summary .chev{margin-left:auto;color:var(--dim);transition:transform .15s}
details.dbtn[open]>summary{border-color:var(--red);background:var(--red2)}
details.dbtn[open]>summary .chev{transform:rotate(90deg)}
.pm{flex:none;width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--card2);color:var(--text);font-size:18px;font-weight:800;cursor:pointer;padding:0;line-height:1}
.sortbar button.dir{min-width:34px;text-align:center}
button.more{display:block;width:100%;margin:4px 0 8px;padding:8px;border:1px dashed var(--line);border-radius:var(--r);background:transparent;color:var(--gold);font-size:13px;cursor:pointer}
[hidden]{display:none!important}
.daybanner{display:flex;align-items:baseline;flex-wrap:wrap;gap:4px 8px;margin:4px 0 8px;padding:10px 14px;border-radius:var(--r);border:1px solid var(--gold);background:var(--top6-bg)}
.daybanner b{font-size:22px;color:var(--gold);font-variant-numeric:tabular-nums}
.daybanner>span{font-size:14px;color:var(--text)}
.daybanner .rel{font-size:13px;font-weight:800;color:var(--on-red);background:var(--red);border-radius:999px;padding:1px 10px}
.daybanner>div{flex-basis:100%}
.tapbtn{display:flex;align-items:center;justify-content:center;gap:6px;margin-top:8px;padding:9px 12px;border-radius:10px;border:1px solid var(--gold);background:var(--top6-bg);color:var(--gold);font-weight:700;font-size:14px}
.tapbtn .chev,.nolink .chev{display:inline-block;transition:transform .15s}
.cand.open .tapbtn .chev{transform:rotate(90deg)}
.nolink{color:var(--gold);text-decoration:underline;text-underline-offset:3px}

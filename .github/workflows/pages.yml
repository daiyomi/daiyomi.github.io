name: pages

# 台ヨミの公開ページを GitHub Pages に出す（main の中身をそのまま）。
# 中身（index.html など）は毎朝自動で作り直して置く。
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
        
  # 履歴を積まない：公開のあとで main を今の中身だけの1コミットに置き換える
  squash:
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: main を1コミットにまとめる
        run: |
          if [ "$(git rev-list --count HEAD)" -le 1 ]; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          msg="$(git log -1 --format=%s)"
          git checkout --orphan squashed
          git commit -q -m "$msg"
          git push --force-with-lease=main:"$GITHUB_SHA" origin squashed:main

